name: refresh stats

# No `push` trigger on purpose: this job commits the SVGs it draws, and a push
# trigger would make it re-run on its own commit forever.
on:
  schedule:
    - cron: "23 20 * * *"        # 05:23 KST, after the day's work has landed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # The script is standard library only, so there is nothing to install.
      #
      # The default GITHUB_TOKEN is enough to read a public contribution
      # calendar. If a run ever fails with a null `user`, create a PAT with
      # read:user, store it as the STATS_TOKEN secret, and it will be preferred.
      - name: Draw the stat graphics
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: Commit whatever changed
        run: |
          FILES="stats.svg streak.svg langs.svg heatmap.svg clock.svg recent.svg stack.svg hd-*.svg"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: refresh profile graphics"
          git push
